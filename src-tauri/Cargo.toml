[package]
name = "keyclick"
version = "1.0.0"
description = "KeyClick - Make typing sound satisfying."
authors = ["KeyClick"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "keyclick_lib"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cpal = "0.17.3"
crossbeam-channel = "0.5.17"
crossbeam-queue = "0.3.14"
fastrand = "2.5.0"
hound = "3.5.1"
lewton = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
